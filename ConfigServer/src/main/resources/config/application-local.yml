datasource:
  driver-class-name: com.mysql.cj.jdbc.Driver
  url: jdbc:mysql://localhost:3306/com
  username: com
  password: com01
  hikari:
    maximum-pool-size: 20 # 각 서비스의 최대 연결 수 제한
    connection-timeout: 20000 # 연결을 얻기 위한 최대 대기 시간 (밀리초)
    idle-timeout: 30000 # 유휴 상태에서 연결을 유지할 시간 (밀리초)
    minimum-idle: 5 # 유휴 상태로 유지할 연결 수
    max-lifetime: 1800000 # 연결의 최대 수명 (밀리초)

jpa:
  hibernate:
    ddl-auto: none
  open-in-view: false
  show-sql: true
  properties:
    hibernate:
      format_sql: true

token:
  accessSecret: "7FB814B9D7FFB3D675EF1F525C1D61B254227B3B0A771DDDBDFE4112A1F42F66" # sha256(egovframework)
  refreshSecret: "C8A1E0F3B2D9475E6A1C0B9F8E7D6C5B4A39281706152433445566778899AABB" # sha256(egovframework-refresh) — access와 분리
  accessExpiration: 7200000 # TTL (millisecond, 2 Hour)
  refreshExpiration: 86400000 # TTL (millisecond, 1 Day)

gateway:
  internalSecret: "7FB814B9D7FFB3D675EF1F525C1D61B254227B3B0A771DDDBDFE4112A1F42F66" # Gateway-Downstream HMAC. 운영 시 token.accessSecret과 분리 권장

org:
  egovframe:
    crypto:
      algorithm: SHA-256
      algorithmKey: ${EGOV_CRYPTO_ALGORITHM_KEY:egovframe}
      algorithmKeyHash: ${EGOV_CRYPTO_ALGORITHM_KEY_HASH:gdyYs/IZqY86VcWhT8emCYfqY1ahw2vtLG+/FzNqtrQ=}
